name: CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade build
        pip install clingo
        pip install numpy
        pip install pytest
        pip install scipy
        pip install .

    - name: Test with pytest
      run: |
        cd test && pytest -v test_exact_inference.py && pytest -v test_map_mpe.py && pytest -v test_approximate_inference.py && pytest -v test_abduction.py && pytest -v test_lifted.py && pytest -v test_hybrid.py && pytest -v test_pasta_parser.py

